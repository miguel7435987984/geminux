name: Build Geminux OS ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Geminux Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Geminux Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Fix and Optimize Build Script
        run: |
          chmod +x build/build-iso.sh
          chmod +x apps/prius-terminal/prius
          chmod +x apps/prius-terminal/install.sh
          chmod +x apps/geminux-vm/geminux-vm
          chmod +x apps/geminux-ai/geminux-ai
          chmod +x build/live-hooks/customize.sh

      - name: Build Geminux ISO Image
        run: |
          sudo ./build/build-iso.sh

      - name: Upload Geminux ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geminux-1.0-amd64-iso
          path: geminux-1.0-amd64.iso
          retention-days: 14

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: geminux-1.0-amd64.iso
          tag_name: v1.0
          name: Geminux OS 1.0 LTS (Resolute)
          make_latest: true
          body: |
            ## 🚀 Geminux OS 1.0 LTS (Resolute) - Atualização Oficial
            Imagem Live ISO oficial do Geminux OS 1.0 LTS mantida pela **Geminux OS Team**.

            ### 💎 Novidades e Recursos Desta Edição:
            - **Geminux AI Integrado:** Assistente nativo inteligente com Dark Neon, modo offline e suporte a Google Gemini 3.8, DeepSeek e Qwen (Alibaba).
            - **Codef Studio Integrado:** Aba exclusiva para projetar e criar aplicativos para Android (Kotlin/Compose), iOS (SwiftUI), Web e Geminux OS Desktop.
            - **Geminux Virtual Machine:** Gerenciador multi-motor (KVM, Hyper-V, VirtualBox, VMware) com alocação dinâmica de RAM e suporte corrigido para macOS e Windows.
            - **Prius Terminal:** Terminal padrão de alta velocidade e customização fixado na dock do sistema.
            - **Sober Fix (Roblox Cleaner):** Utilitário oficial para reparo de cache e estabilidade do Sober / Roblox.
            - **Geminux Store:** Catálogo de aplicativos AppStream nativo com repositório próprio verificado.
            - **Base:** Ubuntu 26.04 LTS (Resolute) com kernel Linux estável e suporte até outubro de 2030.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
