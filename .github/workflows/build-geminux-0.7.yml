name: Build Geminux OS 0.7 LTS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'Geminux 0.7 LTS/**'
      - '.github/workflows/build-geminux-0.7.yml'

jobs:
  build-iso-0-7:
    name: Build Geminux 0.7 Live ISO (Ubuntu 23.04 Lunar)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ubuntu-keyring xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools wget distro-info debootstrap
          # Garante script debootstrap para lunar apontando para gutsy se não existir
          if [ ! -e "/usr/share/debootstrap/scripts/lunar" ]; then
            sudo ln -sf gutsy /usr/share/debootstrap/scripts/lunar || true
          fi

      - name: Prepare Scripts Permissions
        run: |
          chmod +x "Geminux 0.7 LTS/build/build-iso.sh"
          chmod +x "Geminux 0.7 LTS/build/customize.sh"

      - name: Build Geminux 0.7 ISO
        run: |
          cd "Geminux 0.7 LTS"
          sudo ./build/build-iso.sh

      - name: Upload Geminux 0.7 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geminux-0.7-amd64-iso
          path: Geminux 0.7 LTS/geminux-0.7-amd64.iso
          retention-days: 14

      - name: Create Geminux 0.7 GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/geminux-0.7-lts' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v0.7')
        with:
          files: Geminux 0.7 LTS/geminux-0.7-amd64.iso
          tag_name: v0.7
          name: Geminux OS 0.7 LTS (Ubuntu 23.04 Lunar Lobster)
          make_latest: false
          body: |
            ## 🚀 Geminux OS 0.7 LTS (Ubuntu 23.04 Lunar Lobster)
            Edição histórica clássica do Geminux OS construída sobre a base do **Ubuntu 23.04 (Lunar Lobster)**.

            ### 💎 Recursos Desta Edição 0.7 LTS:
            - **Base Clássica Lunar:** Ubuntu 23.04 (Lunar Lobster) com Kernel 6.2 e GNOME 44.
            - **Instalador Oficial Calamares:** Instalação intuitiva e ágil com particionamento automático e suporte UEFI/BIOS.
            - **Prius Terminal:** Fixado por padrão nos favoritos da barra de tarefas (dock).
            - **Áudio Nativo PipeWire & WirePlumber:** Desempenho de áudio de baixa latência.
            - **Boot Splash Plymouth Oficial:** Inicialização com identidade visual neon e spinner de alta precisão.
            - **Isolamento Total:** Release independente que preserva 100% as edições Geminux 1.0 LTS, 0.9 LTS e 0.8 LTS.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
