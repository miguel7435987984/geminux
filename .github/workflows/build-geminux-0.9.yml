name: Build Geminux OS 0.9 LTS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'Geminux 0.9 LTS/**'
      - '.github/workflows/build-geminux-0.9.yml'

jobs:
  build-iso-0-9:
    name: Build Geminux 0.9 Live ISO (Ubuntu 25.10 Kanguru)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ubuntu-keyring xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools wget distro-info
          wget -q "http://archive.ubuntu.com/ubuntu/pool/main/d/debootstrap/debootstrap_1.0.144ubuntu1_all.deb" -O /tmp/debootstrap.deb
          sudo dpkg -i /tmp/debootstrap.deb
          rm -f /tmp/debootstrap.deb

      - name: Prepare Scripts Permissions
        run: |
          chmod +x "Geminux 0.9 LTS/build/build-iso.sh"
          chmod +x "Geminux 0.9 LTS/build/customize.sh"

      - name: Build Geminux 0.9 ISO
        run: |
          cd "Geminux 0.9 LTS"
          sudo ./build/build-iso.sh

      - name: Upload Geminux 0.9 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geminux-0.9-amd64-iso
          path: Geminux 0.9 LTS/geminux-0.9-amd64.iso
          retention-days: 14

      - name: Create Geminux 0.9 GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v0.9')
        with:
          files: Geminux 0.9 LTS/geminux-0.9-amd64.iso
          tag_name: v0.9
          name: Geminux OS 0.9 LTS (Ubuntu 25.10 Kanguru)
          make_latest: false
          body: |
            ## 🚀 Geminux OS 0.9 LTS (Ubuntu 25.10 Kanguru)
            Versão predecessora oficial do Geminux OS, baseada no **Ubuntu 25.10 (Kanguru / Questing)**.

            ### 💎 Recursos Desta Edição 0.9 LTS:
            - **Boot Splash Plymouth Nítido:** Animação de boot oficial do Ubuntu 25.10 nítida (bug do borrão corrigido).
            - **Prius Terminal:** Fixado por padrão nos favoritos da barra de tarefas (dock).
            - **Áudio Nativo PipeWire & WirePlumber:** Desempenho de áudio de baixa latência.
            - **Base:** Ubuntu 25.10 (Questing) com Kernel Linux 6.17 e GNOME Desktop.
            - **Isolamento Total:** Release independente que preserva 100% o Geminux 1.0 LTS.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
