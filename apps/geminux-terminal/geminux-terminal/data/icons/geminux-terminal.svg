<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="50%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#f38ba8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5" />

  <!-- Top bar dots -->
  <circle cx="26" cy="26" r="4.5" fill="#f38ba8"/>
  <circle cx="39" cy="26" r="4.5" fill="#f9e2af"/>
  <circle cx="52" cy="26" r="4.5" fill="#a6e3a1"/>

  <!-- Command Prompt Symbol '>_' -->
  <path d="M 28 48 L 48 64 L 28 80" fill="none" stroke="url(#neon-cyan)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <line x1="56" y1="80" x2="84" y2="80" stroke="url(#neon-purple)" stroke-width="6.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Subtle grid element -->
  <circle cx="98" cy="46" r="2.5" fill="#89b4fa" opacity="0.6"/>
  <circle cx="98" cy="58" r="2.5" fill="#cba6f7" opacity="0.6"/>
  <circle cx="98" cy="70" r="2.5" fill="#f5c2e7" opacity="0.6"/>
</svg>
