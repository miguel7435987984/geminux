<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="aiGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="aiGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="brainGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="aiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing background network rings -->
  <circle cx="250" cy="250" r="210" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
  <ellipse cx="250" cy="250" rx="190" ry="100" fill="none" stroke="#00d2ff" stroke-width="2.5" stroke-opacity="0.4" transform="rotate(-30 250 250)"/>
  <ellipse cx="250" cy="250" rx="190" ry="100" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.4" transform="rotate(30 250 250)"/>

  <!-- Neural Nodes & Connection Synapses -->
  <path d="M 140 180 L 250 250 L 360 180" stroke="#00d2ff" stroke-width="3" stroke-opacity="0.6"/>
  <path d="M 140 320 L 250 250 L 360 320" stroke="#818cf8" stroke-width="3" stroke-opacity="0.6"/>
  <path d="M 250 120 L 250 380" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Geminux Twin Diamonds (AI Core Engine) -->
  <polygon points="200,160 250,220 200,340 150,250" fill="url(#aiGrad1)" opacity="0.95" filter="url(#aiGlow)"/>
  <polygon points="300,160 350,250 300,340 250,220" fill="url(#aiGrad2)" opacity="0.95" filter="url(#aiGlow)"/>

  <!-- Glowing Brain / AI Core Spark -->
  <circle cx="250" cy="250" r="32" fill="#ffffff" filter="url(#aiGlow)"/>
  <circle cx="250" cy="250" r="20" fill="url(#brainGlow)"/>

  <!-- Synapse Nodes -->
  <circle cx="140" cy="180" r="10" fill="#00f2fe" filter="url(#aiGlow)"/>
  <circle cx="360" cy="180" r="10" fill="#00c6ff" filter="url(#aiGlow)"/>
  <circle cx="140" cy="320" r="10" fill="#818cf8" filter="url(#aiGlow)"/>
  <circle cx="360" cy="320" r="10" fill="#a855f7" filter="url(#aiGlow)"/>
  <circle cx="250" cy="120" r="12" fill="#38bdf8" filter="url(#aiGlow)"/>
  <circle cx="250" cy="380" r="12" fill="#6366f1" filter="url(#aiGlow)"/>
</svg>
